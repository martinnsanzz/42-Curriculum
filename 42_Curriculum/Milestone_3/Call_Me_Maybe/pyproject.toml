[project]
name = "Call_Me_Maybe"
version = "0.0.1"
requires-python = ">=3.13"
readme = "README.md"
description = """
This project creates a function calling tool that translates natural language
prompts into structured function calls
"""
authors = [
    {name = "masanz-s",email = "masanz-s@student.codam.nl"}
]
dependencies = [
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "llm_sdk"
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "flake8-pyproject>=1.2.4",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "uv>=0.12.1",
    "pudb>=2025.1.5",
]

[tool.mypy]
exclude = [
    '^llm_sdk/',
    '^.venv',
    "moulinette"
]

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true

[tool.flake8]
exclude = [
    ".venv/",
    "llm_sdk/",
    "moulinette"
]

[tool.uv.workspace]
members = [
    "llm_sdk",
    "moulinette",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
moulinette = { workspace = true }
